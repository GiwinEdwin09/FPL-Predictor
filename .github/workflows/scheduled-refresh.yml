name: Scheduled Refresh

on:
  schedule:
    - cron: "30 5,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-model-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt && python -m pip install --no-deps -e .

      - name: Restore downloaded source data
        id: source-cache
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: |
            data/historical/football-data/raw
            data/cache/upstream
          key: refresh-sources-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            refresh-sources-v1-${{ runner.os }}-

      - name: Run refresh pipeline
        id: pipeline
        env:
          PYTHONPATH: src
        run: python scripts/run_refresh_pipeline.py --model-version v3

      - name: Save downloaded source data
        continue-on-error: true
        if: ${{ always() && steps.pipeline.outcome != 'skipped' && steps.source-cache.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@v5
        with:
          path: |
            data/historical/football-data/raw
            data/cache/upstream
          key: ${{ steps.source-cache.outputs.cache-primary-key }}

      - name: Commit refreshed artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/data/dashboard.json data/predictions_ledger.json data/features/match_pre_match_features_v3.csv data/models/model_v3.json data/models/model_v3_bundle.json data/models/model_v3_metrics.json data/models/model_v3_team_keys.json data/models/model_v3_xgboost.json
          if git diff --cached --quiet; then
            echo "No dashboard or model changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh v3 prediction bundle"
          git push
