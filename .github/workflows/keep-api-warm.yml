name: Keep API Warm

# Render's free web service spins down after 15 minutes without inbound traffic
# and takes about a minute to wake. The lineup tools are the only features that
# call it, so a request every ten minutes keeps them responsive.
#
# Free instances get 750 hours per month and a 31-day month is 744, so running
# around the clock leaves almost no slack for deploy overlap. A suspended service
# is worse than a slow one, so the schedule skips 02:00-05:59 UTC (about 124
# hours per month); the first request after that gap just wakes the API as before.

on:
  schedule:
    - cron: "3,13,23,33,43,53 0-1,6-23 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-api-warm
  cancel-in-progress: true

env:
  API_URL: https://fpl-predictor-api-bk8f.onrender.com

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # A failed run emails the repository owner, so this doubles as an uptime alert.
      - name: Request the health endpoint
        run: >
          curl --fail --silent --show-error --output /dev/null
          --max-time 120 --retry 2 --retry-delay 10 --retry-all-errors
          --write-out "status=%{http_code} ttfb=%{time_starttransfer}s total=%{time_total}s\n"
          "$API_URL/health"
